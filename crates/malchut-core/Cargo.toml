[package]
name = "malchut-core"
version = "0.1.0"
edition = "2024"

[dependencies]
cairo-rs = { version = "0.22.9", features = ["pdf", "png"] }
comrak = { version = "0.59.0", default-features = false }
gdk-pixbuf = "0.22.0"
gio = "0.22.10"
glib = "0.22.10"
librsvg = "2.63.4"
merman = "0.10.0"
pango = { version = "0.22.9", features = ["v1_50"] }
pangocairo = "0.22.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
syntect = "5.3.0"
thiserror = "2.0.21"
toml = "1.2.1"
two-face = "0.5.2"

[dev-dependencies]
insta = "1.49.0"
